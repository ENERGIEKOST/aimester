<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>404 — Страница не найдена | Ай`Мастер</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .err-page {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .err-card {
      width: min(520px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: clamp(28px, 5vw, 44px) clamp(20px, 4vw, 36px);
    }
    .err-code {
      font-size: clamp(4rem, 12vw, 6.5rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--yellow), var(--yellow2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .err-title {
      font-size: clamp(1.3rem, 3vw, 1.7rem);
      margin-bottom: 12px;
      color: #fff;
    }
    .err-text {
      color: var(--muted);
      font-size: 0.98rem;
      margin-bottom: 28px;
    }
    .err-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .err-meta {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="err-page">
    <div class="err-card">
      <div class="err-code">404</div>
      <h1 class="err-title">Страница не найдена</h1>
      <p class="err-text">
        Возможно, ссылка устарела или страница была перемещена при обновлении сайта. 
        Вернитесь на главную или позвоните нам — поможем с ремонтом любой техники.
      </p>
      <div class="err-actions">
        <a href="/" class="btn btn--primary">На главную</a>
        <a href="tel:+79612799090" class="btn btn--ghost">+7 (961) 279-90-90</a>
      </div>
      <div class="err-meta">
        Сервисный центр «Ай`Мастер» · Батайск, ул. Луначарского, 188/11
      </div>
    </div>
  </main>
</body>
</html>
